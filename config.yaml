# 1. КОНТЕКСТ ПОЛЬЗОВАТЕЛЯ (КТО ВЫ И ЗАЧЕМ ЭТО ДЕЛАЕТЕ)
user_context:
  profile: |
    - Роль: Руководитель AI-продуктов / AI Product Owner.
    - Цель: Создать убедительную концепцию нового HR-Tech продукта, чтобы доказать свою компетенцию и возглавить это новое бизнес-направление.
    - Ключевые Компетенции: Full-Cycle ML Development, Продуктовое Мышление, R&D и Системный Анализ.
    - Стиль Работы: Наиболее эффективен в роли, требующей интеллектуального лидерства (анализ, стратегия, архитектура ИИ).
  main_goal: |
    Подготовить высококачественную, убедительную аналитическую записку для коммерческого директора ТГУ, предлагающую концепцию нового продукта в рамках существующей экосистемы iDO.
    Цель записки — не просто предоставить информацию, а продемонстрировать мою способность взять на себя роль Владельца Продукта (Product Owner) для этого конкретного проекта.
    **Ключевой акцент должен быть сделан на экономическом обосновании:** необходимо доказать, что предлагаемый продукт не просто технологически интересен, а является коммерчески жизнеспособным и прибыльным предприятием.

# 2. КОНТЕКСТ ПРОЕКТА (ЧТО НУЖНО СДЕЛАТЬ)
project_context:
  product_vision: |
    - **Идея 1: "Карьерный Навигатор"** - Трансформация обучения в карьерный рост через интерактивные карты траекторий.
    - **Идея 2: "AI-Агент/Ментор"** - Персонализированная поддержка в масштабе через интеллектуального помощника.
    - **Идея 3: "Talent-as-a-Service"** - Создание "внутреннего рынка талантов" для руководителей.
    - **КЛЮЧЕВОЕ ТРЕБОВАНИЕ:** Эти идеи должны быть не просто описаны, а уложены в **дорожную карту продукта (Product Roadmap)** с оценкой этапов (MVP, v1.0, v2.0) и **финансовую модель**, включающую оценку затрат на разработку (CAPEX), операционных расходов (OPEX) и прогнозируемой выручки (Revenue).
  location:
    city: "Томск, Россия"
    comment: "С высокой вероятностью (90%) основная команда разработки будет находиться здесь. Финансовые расчеты (зарплаты, аренда) должны в первую очередь учитывать этот регион. Если данных по региону нет, использовать данные по Москве/РФ с предложением поправочного коэффициента."

# 3. ИСХОДНЫЕ ГИПОТЕЗЫ (ЧТО МЫ ДУМАЕМ, ЧТО ЗНАЕМ - ТРЕБУЕТ ПРОВЕРКИ)
initial_hypotheses:
  tsu_assets_analysis: |
    - **Синергия:** Портфель ТГУ - это экосистема с ядром в виде LMS IDO (Moodle). Продукты (ИИ-оценщик, Репетитор) интегрируются как модули.
    - **Рынки:** Текущий фокус - B2Edu/B2G. Выход на B2B HR-рынок - это гипотеза.
    - **Технологии:** Moodle и собственные AI-разработки.
    - **Актив "ИИ-оценщик":** Сильные стороны - автоматизация, обратная связь. Слабые стороны - ограничен гуманитарными текстами, требует постпроверки, привязан к Moodle. Готовность к B2B HR: 3/10.
    - **Актив "LMS IDO":** Сильные стороны - готовая LMS, техподдержка, в реестре ПО РФ. Слабые стороны - устаревший UI/UX, риски производительности, академическая направленность. Готовность к B2B HR: 5/10.
    - **Скрытые Активы:** Есть компетенции в чат-ботах (бот 'Expecto Patronum'), анализе рынка труда ("РосНавык") и блокчейн-креденшелах ("Кампусная карта").
    - **Главная Гипотеза:** Стратегия - не продажа "как есть", а пересборка активов в новый B2B HR-продукт.
  additional_tasks:
    - "Провести открытый поиск других EdTech-проектов, стартапов и цифровых инициатив, связанных с ТГУ."
    - "Найти рыночные бенчмарки и типовые бизнес-модели для B2B HR-Tech SaaS продуктов в РФ."
    - "Собрать данные по средним зарплатам Python-разработчиков, ML-инженеров и менеджеров продуктов в Томске и Москве для базовой оценки затрат."